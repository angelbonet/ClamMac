site_name: ClamMac
site_description: Antivirus para Mac basado en ClamAV - Documentación
site_author: abDatabase
site_url: https://angelbonet.github.io/ClamMac/

repo_name: angelbonet/ClamMac
repo_url: https://github.com/angelbonet/ClamMac

theme:
  name: material
  language: es
  logo: img/icon.png
  favicon: img/icon.png
  palette:
    - scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Guía de usuario:
      - Instalación: guia/instalacion.md
      - Permisos: guia/permisos.md
      - Uso: guia/uso.md
      - Comprobar que funciona: guia/prueba.md
      - Actualizaciones: guia/actualizaciones.md
      - Seguridad y privacidad: guia/seguridad.md
      - Problemas frecuentes: guia/problemas.md
  - Desarrollo:
      - Compilar y firmar: desarrollo/compilar.md
      - Estructura del proyecto: desarrollo/estructura.md
      - Publicar una versión: desarrollo/publicar.md
  - Cambios: changelog.md

extra:
  social:
    - icon: fontawesome/solid/mug-hot
      link: https://buymeacoffee.com/angelbonet
      name: Invita un café
    - icon: fontawesome/solid/globe
      link: https://abdatabase.com
      name: abDatabase
